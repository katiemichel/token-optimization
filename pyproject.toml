[project]
name = "model-selection-demo"
version = "0.1.0"
description = "Workshop demo for model selection & token efficiency with GitHub Copilot."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cart", "messy", "inventory", "reporting", "linkcheck"]

[tool.pytest.ini_options]
testpaths = ["demos"]
python_files = ["test_*.py"]
addopts = "-q"
